name: Deploy web to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Web version (must match web/package.json)'
        required: true
        type: string
      skip_version_bump:
        description: 'Deploy the current version without creating a new version tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate deployment version
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
          SKIP_VERSION_BUMP: ${{ inputs.skip_version_bump }}
        run: node scripts/check-deploy-version.js web "$DEPLOY_VERSION" "$SKIP_VERSION_BUMP"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build production web application
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:production

      - name: Write deployed web version
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node -e "require('node:fs').writeFileSync('web/dist/version.json', JSON.stringify({version:process.env.DEPLOY_VERSION,commit:process.env.DEPLOY_COMMIT})+'\\n')"

      - name: Deploy live Firebase Hosting channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

      - name: Verify deployed web version
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_COMMIT: ${{ github.sha }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          node - <<'NODE'
          const expected = process.env.DEPLOY_VERSION;
          const commit = process.env.DEPLOY_COMMIT;
          const url = `https://${process.env.FIREBASE_PROJECT_ID}.web.app/version.json`;
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                const deployed = response.ok ? await response.json() : null;
                if (deployed?.version === expected && deployed.commit === commit) {
                  console.log(`Web version ${expected} at ${commit} is live.`);
                  return;
                }
              } catch (error) {
                console.log(`Waiting for web: ${error.message}`);
              }
              await delay(10000);
            }
            throw new Error(`Web version ${expected} at ${commit} did not become live within 5 minutes.`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Record deployed web version
        if: ${{ !inputs.skip_version_bump }}
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          git tag "web/v${DEPLOY_VERSION}" "$GITHUB_SHA"
          git push origin "web/v${DEPLOY_VERSION}"
